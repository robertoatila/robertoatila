  .label { font: 500 14px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif; fill: #8b949e; }
  .value { font: 700 28px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif; fill: #f0f6fc; }
  .rule { stroke: #21262d; }
